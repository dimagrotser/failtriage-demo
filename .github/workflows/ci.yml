name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.6"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest --reruns 1 --junitxml=reports/junit.xml
      # Runs after failing tests too. Without ANTHROPIC_API_KEY the report comes from the rules alone.
      - uses: dimagrotser/ai-test-failure-triage@v1
        if: ${{ !cancelled() }}
        with:
          junit: reports/junit.xml
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
